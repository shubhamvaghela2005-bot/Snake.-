<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Snake</title>
<style>
:root{--bg:#10201a;--board:#17302a;--grid:#1d3a32;--snake:#7be0a4;--head:#d9ffe8;--food:#ff7a59;--text:#e8f5ee;color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#10201a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;touch-action:none;overflow:hidden}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#score{font-size:22px;font-weight:700}
canvas{background:var(--board);border-radius:10px;max-width:94vw;max-height:60vh;touch-action:none}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(16,32,26,.88);text-align:center;padding:24px}
#msg h1{margin:0;font-size:34px}
#msg p{margin:0;opacity:.8}
button{font:inherit;font-weight:700;background:var(--snake);color:#0b1a14;border:0;border-radius:12px;padding:14px 30px;font-size:18px}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:8px}
.pad button{padding:0;font-size:22px;background:var(--grid);color:var(--text)}
.u{grid-column:2}.l{grid-column:1;grid-row:2}.d{grid-column:2;grid-row:2}.r{grid-column:3;grid-row:2}
</style>
</head>
<body>
<div id="score">Score: 0</div>
<canvas id="c" width="320" height="320"></canvas>
<div class="pad">
<button class="u" data-d="u">▲</button><button class="l" data-d="l">◀</button><button class="d" data-d="d">▼</button><button class="r" data-d="r">▶</button>
</div>
<div id="msg"><h1>Snake</h1><p>Swipe or use the arrows.</p><button id="go">Play</button></div>
<script>
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),N=16,S=cv.width/N;
var snake,dir,next,food,score,timer,best=0;
try{best=+localStorage.getItem('snakeBest')||0}catch(e){}
function reset(){snake=[{x:8,y:8},{x:7,y:8},{x:6,y:8}];dir={x:1,y:0};next=dir;score=0;place();upd()}
function upd(){document.getElementById('score').textContent='Score: '+score+'   Best: '+best}
function place(){do{food={x:Math.random()*N|0,y:Math.random()*N|0}}while(snake.some(function(s){return s.x==food.x&&s.y==food.y}))}
function step(){
  dir=next;var h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(function(s){return s.x==h.x&&s.y==h.y})){return over()}
  snake.unshift(h);
  if(h.x==food.x&&h.y==food.y){score++;place();upd()}else snake.pop();
  draw();
}
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#ff7a59';ctx.beginPath();ctx.arc(food.x*S+S/2,food.y*S+S/2,S/2.5,0,7);ctx.fill();
  snake.forEach(function(s,i){ctx.fillStyle=i?'#7be0a4':'#d9ffe8';ctx.fillRect(s.x*S+1,s.y*S+1,S-2,S-2)});
}
function over(){
  clearInterval(timer);
  if(score>best){best=score;try{localStorage.setItem('snakeBest',best)}catch(e){}}
  var m=document.getElementById('msg');m.style.display='flex';
  m.querySelector('h1').textContent='Game over';
  m.querySelector('p').textContent='You scored '+score+'. Best: '+best;
  document.getElementById('go').textContent='Play again';
}
function start(){document.getElementById('msg').style.display='none';reset();draw();clearInterval(timer);timer=setInterval(step,220)}
function turn(d){
  var m={u:{x:0,y:-1},d:{x:0,y:1},l:{x:-1,y:0},r:{x:1,y:0}}[d];
  if(m.x!==-dir.x||m.y!==-dir.y)next=m;
}
document.getElementById('go').onclick=start;
document.querySelectorAll('.pad button').forEach(function(b){b.addEventListener('touchstart',function(e){e.preventDefault();turn(b.dataset.d)});b.addEventListener('click',function(){turn(b.dataset.d)})});
document.addEventListener('keydown',function(e){var k={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r'}[e.key];if(k)turn(k)});
var sx,sy;
document.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',function(e){
  var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
  turn(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'));
},{passive:true});
reset();draw();
</script>
</body>
</html>
